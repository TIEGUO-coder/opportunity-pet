<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opportunity Pet Recording Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101215;
        --panel: #171b20;
        --line: #2b3139;
        --text: #f2eee6;
        --muted: #b5afa6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(190, 156, 92, 0.15), transparent 28%),
          linear-gradient(180deg, #13161a, var(--bg));
        color: var(--text);
        font: 16px/1.45 Georgia, "Times New Roman", serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        display: grid;
        gap: 20px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(23, 27, 32, 0.92);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      figure {
        margin: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #0e1114;
      }

      figcaption {
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--muted);
      }

      img,
      video {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 14px;
        background: #0d1117;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opportunity Pet Recording Preview</h1>
      <p>This page plays the exported files directly in the browser so we can verify motion without relying on Finder or Preview thumbnails.</p>
      <section class="grid">
        <figure>
          <figcaption>MP4 autoplay loop</figcaption>
          <video autoplay muted loop controls playsinline src="/private/tmp/opportunity-pet-recordly-final-v11.mp4"></video>
        </figure>
        <figure>
          <figcaption>GIF file</figcaption>
          <img src="/private/tmp/opportunity-pet-recordly-final-v11.gif" alt="Opportunity Pet animated preview">
        </figure>
      </section>
    </main>
  </body>
</html>
