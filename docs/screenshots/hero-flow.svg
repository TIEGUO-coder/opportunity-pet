<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="680" rx="28" fill="#0D1117"/>
  <rect x="56" y="54" width="1088" height="572" rx="30" fill="#F4EFE3"/>
  <text x="96" y="118" fill="#2B2924" font-family="Arial, sans-serif" font-size="42" font-weight="700">A pet that brings back a lead</text>
  <text x="96" y="158" fill="#625D55" font-family="Arial, sans-serif" font-size="21">Then turns a fuzzy idea into something worth grilling, planning, and routing.</text>
  <g transform="translate(92 220)">
    <rect width="246" height="270" rx="22" fill="#FCFAF3" stroke="#D0C7B6" stroke-width="2"/>
    <text x="28" y="52" fill="#8B5B0C" font-family="Arial, sans-serif" font-size="16" font-weight="700">1. SCOUT</text>
    <text x="28" y="94" fill="#2B2924" font-family="Arial, sans-serif" font-size="28" font-weight="700">Your pet</text>
    <text x="28" y="126" fill="#2B2924" font-family="Arial, sans-serif" font-size="28" font-weight="700">wanders out</text>
    <path d="M115 196 C84 191 68 170 76 145 C84 119 114 111 145 121 C175 131 194 154 185 178 C176 204 148 201 115 196Z" fill="#CF7927"/>
    <path d="M146 125 C166 99 202 104 206 137 C210 169 182 187 158 174 C139 164 132 143 146 125Z" fill="#F3E8D6"/>
    <path d="M73 151 C57 139 48 119 55 103 C79 110 92 125 94 151Z" fill="#3C3124"/>
    <path d="M182 153 C222 126 231 84 202 73" stroke="#2F281F" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g transform="translate(376 220)">
    <rect width="330" height="270" rx="22" fill="#FCFAF3" stroke="#D0C7B6" stroke-width="2"/>
    <text x="28" y="52" fill="#8B5B0C" font-family="Arial, sans-serif" font-size="16" font-weight="700">2. LEAD</text>
    <text x="28" y="94" fill="#2B2924" font-family="Arial, sans-serif" font-size="30" font-weight="700">Missed-Quote</text>
    <text x="28" y="130" fill="#2B2924" font-family="Arial, sans-serif" font-size="30" font-weight="700">Money Finder</text>
    <text x="28" y="174" fill="#625D55" font-family="Arial, sans-serif" font-size="18">Local service businesses lose</text>
    <text x="28" y="200" fill="#625D55" font-family="Arial, sans-serif" font-size="18">jobs when quote replies are late.</text>
    <rect x="28" y="222" width="188" height="30" rx="15" fill="#E3E7DD"/>
    <text x="48" y="243" fill="#536B5D" font-family="Arial, sans-serif" font-size="16" font-weight="700">Curated demo lead</text>
  </g>
  <g transform="translate(744 220)">
    <rect width="360" height="270" rx="22" fill="#FCFAF3" stroke="#D0C7B6" stroke-width="2"/>
    <text x="28" y="52" fill="#8B5B0C" font-family="Arial, sans-serif" font-size="16" font-weight="700">3. ROUTE</text>
    <text x="28" y="94" fill="#2B2924" font-family="Arial, sans-serif" font-size="30" font-weight="700">Copy a brief</text>
    <text x="28" y="130" fill="#2B2924" font-family="Arial, sans-serif" font-size="30" font-weight="700">for grilling</text>
    <rect x="28" y="158" width="304" height="38" rx="10" fill="#647568"/>
    <text x="76" y="183" fill="#FFFDF5" font-family="Arial, sans-serif" font-size="17" font-weight="700">Copy Grill-with-docs brief</text>
    <text x="28" y="230" fill="#625D55" font-family="Arial, sans-serif" font-size="18">The useful leads become</text>
    <text x="28" y="256" fill="#625D55" font-family="Arial, sans-serif" font-size="18">routemap-ready project work.</text>
  </g>
  <path d="M338 355 H376" stroke="#8B5B0C" stroke-width="4" stroke-linecap="round"/>
  <path d="M706 355 H744" stroke="#8B5B0C" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="566" fill="#2B2924" font-family="Arial, sans-serif" font-size="28" font-weight="700">notice a lead -> stress-test it -> turn it into tasks -> keep the work moving</text>
